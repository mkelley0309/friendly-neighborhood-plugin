    full: "> **Phase council** (QRDPIV: Q) — consult only when the concern is live (full map in `/friendly-neighborhood:creed`): driver `peter`; counsel `robbie` (constructive design questions), `jameson` (devil's-advocate grilling of poorly-shaped work), `mj`, `aunt-may`; watch villains `sandman` (under-shaped/formless work), `kraven`, `osborn`."
