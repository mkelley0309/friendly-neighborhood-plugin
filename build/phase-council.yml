# build/phase-council.yml — extracted phase-council data (plan 3.5)
#
# Populated once by reading the currently-shipped `plugins/friendly-neighborhood/
# skills/campaign/actions/*.md` (roster: full, superset) and
# `plugins/friendly-neighborhood-lite/skills/campaign/actions/*.md` (roster: lite)
# files — full's council lines already name all the right people (src/README.md
# "Known gaps" #1). Verbatim extraction, not re-derived: each value is the exact
# `> **Phase council** ...` markdown line as it appears today in the shipped file
# for that roster, including its own `/{plugin-slug}:creed` reference.
#
# Only the `workstream` tier's action files carry a phase-council line in either
# shipped edition (confirmed empirically: no `mission`/`patrol`/`responsibility`
# action file under either roster has one — grep run 2026-08-10). The generator
# (build/generate.py) injects the roster-appropriate line into the matching
# tier-skill action file when `features.phase_council` is true, keyed by
# `editions/*.yml`'s `roster:` value (7 -> lite, 32 -> full).
#
# COUPLING CAVEAT: each stored line hardcodes its own edition's plugin slug
# (`friendly-neighborhood-lite` / `friendly-neighborhood`) in the `/slug:creed`
# reference, because today roster=7 is used by exactly one edition (lite) and
# roster=32 by exactly one edition (full). If a future edition ever reuses one
# of these rosters under a different plugin name, this file's slug references
# would need to become a template placeholder instead of a literal — flagged
# here rather than solved, since no such edition exists yet (see build/README.md
# "Known gaps").
#
# Roster-membership check (README's "confirm empirically" instruction): every
# name appearing in a `lite` line below is present in
# `vocabulary/display.yml` `roster.lite` (carnage, jameson, kingpin, miguel,
# mysterio, noir, peter). No discrepancy found.

workstream:
