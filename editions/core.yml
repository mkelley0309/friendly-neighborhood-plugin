# editions/core.yml
# Generator input (plan 3.5) for the `harness-core` edition.
#
# Three orthogonal axes (plan 3.3). An edition is a point in this space —
# no edition-specific logic should live anywhere except this file and its
# two siblings.

plugin:
  name: harness-core
  displayName: Harness Core
  description: >
    An opinionated workflow + knowledge harness with four structural
    differentiators: (1) three-tier work model — objective (long-lived why,
    Key Results, milestones, decisions log) → workstream (heavy QRDBIV
    lifecycle, multi-session) → assignment (lightweight unit, proportional
    admin); (2) progressive distillation — research broadly, then compress at
    every handoff to the fewest, most precise words (semantic density: dense
    meaning per token via careful word choice, not just fewer tokens),
    keeping the decisions reached and dropping the back-and-forth that
    reached them, proportional to work size and targeted at the next
    phase's needs; (3) peer-reviewed
    knowledge pipeline — scout → harvest → distill → cartograph → audit →
    sync, vault grows only by admission, nothing rewrites itself
    unsupervised; (4) a deterministic verification gate (tools/gate.py,
    GO/NO-GO exit code) for hard measurable concerns, leaving soft
    judgments qualitative and recorded; plus determinism for the
    repeatable — any assignment done twice becomes a CLI. No agent
    personas, no theme — just the capabilities.

# Axis 1 — display vocabulary. `none` = pinned identifiers used verbatim as
# display words too (see vocabulary/display.yml: core has no themed entry
# because there's nothing to template).
display: none

# Axis 2 — roster. 0 = no agents/ directory at all; no cast, no lenses, no
# registers.
roster: 0

# Axis 3 — feature flags. Every one of these is themed-cast-adjacent and
# absent from core; confirmed absent on disk (no plugins/harness-core/themes,
# no templates/.vscode, no observation-deck references, no phase-council
# line in tier skill actions, plain single-section output-style... in fact
# core ships no output-styles/ directory at all).
features:
  observation_deck: false
  vscode_workspace: false
  themes: false
  output_style: false        # no output-styles/ directory
  phase_council: false        # no per-agent council block in skill actions
  cast_council: false          # no /friendly-neighborhood:creed-style doctrine skill
  doctrine_skills: []           # church-bell / creed / spider-sense / symbiote — none shipped

# Skills this edition ships, by their PINNED (untethemed) identifier —
# see vocabulary/data-model.yml. Generator emits these directly, no rename.
skills:
  - workstream
  - objective
  - assignment
  - cadence
  - knowledge
  - init-workspace
